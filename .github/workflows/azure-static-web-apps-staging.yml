
# Deploys the permanent `staging` branch to the SWA *named* preview environment
# "staging", which has a stable hostname:
#
#     https://wonderful-rock-071c8e810-staging.<region>.azurestaticapps.net
#
# Because the hostname never changes, its Entra redirect URI
# (.../.auth/login/aad/callback) is registered once and keeps working. Production is
# untouched: that deploy still comes only from the main-branch workflow, and the two
# never fire on the same push, so they cannot race.
#
# Note: staging shares this app's application settings and therefore the SAME Azure SQL
# database as production. Use TST-#### project IDs for test budgets and clear them with
# sql/cleanup_test_budgets.sql.

name: Azure Static Web Apps CI/CD (staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# Auth note: this workflow authenticates with a deployment token, and must NOT pass
# github_id_token. The OIDC path identifies the Static Web App by the workflow's
# *filename*, which has to match Azure's generated
# 'azure-static-web-apps-<adjective>-<noun>-<hex>.yml' pattern. Only the production
# workflow can own that name, so OIDC here fails with
# "Could not determine the Static Web App from the GitHub OIDC workflow reference".
#
# SETUP REQUIRED — this workflow fails with "No matching Static Web App was found or
# the api key was invalid" until the secret below exists:
#   1. Azure Portal -> Static Web App -> Overview -> Manage deployment token -> Reset.
#   2. Copy the new token.
#   3. GitHub -> repo Settings -> Secrets and variables -> Actions -> New repository
#      secret, named AZURE_SWA_DEPLOYMENT_TOKEN, pasting that value.
#   4. Re-run this workflow (Actions -> this workflow -> Run workflow).
# Production is unaffected: it deploys from the main-branch workflow over GitHub OIDC
# and does not use this secret.

jobs:
  build_and_deploy_staging:
    runs-on: ubuntu-latest
    name: Build and Deploy to staging environment
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          action: "upload"
          app_location: "./app"
          api_location: "api"
          output_location: "."
          deployment_environment: staging
