<!-- The ONLY page in this app that anonymous visitors may load
     (app/staticwebapp.config.json allows /login.html; everything else is
     `authenticated` and its 401 override redirects here). So it is standalone
     on purpose: it cannot read the account's theme or accent — those live
     behind the very sign-in this page is asking for — and it must not import
     anything from index.html. Inline CSS + inline JS, no build step, like the
     rest of the frontend. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --green-700:#006527;--green-600:#0a7a36;
  --ink-950:#0b0d0c;--ink-900:#16191a;--ink-800:#23282a;--ink-500:#6b7174;
  --ink-400:#939a9d;--ink-200:#dde1e2;--ink-100:#f1f3f3;--ink-50:#f8f9f9;--white:#fff;
  --danger:#b42318;
  --fb:'Montserrat',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;
  --r:4px;--rm:6px;
  --page:var(--ink-50);--card:var(--white);--bd:var(--ink-200);
  --tx:var(--ink-800);--tx-dim:var(--ink-500);--mark:var(--ink-900);
  --sh:0 1px 2px rgba(11,13,12,.06),0 10px 30px rgba(11,13,12,.08);
}
/* The account's stored theme is unreachable before sign-in, so the OS
   preference is the only signal this page has. */
@media (prefers-color-scheme:dark){
  :root{--page:#0f1211;--card:#181c1b;--bd:#2b3130;--tx:#e6e9e8;--tx-dim:#9aa1a0;
    --mark:#fff;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45)}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--page);color:var(--tx);
  font-size:14px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:392px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rm);
  box-shadow:var(--sh);padding:38px 34px 30px;text-align:center}
.mark{display:block;width:196px;max-width:70%;height:auto;margin:0 auto 26px;color:var(--mark)}
/* The lockup above already says whose product this is, so the heading says
   only which one. */
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 22px;color:var(--tx)}
/* Microsoft's sign-in button spec: their four-square mark, unaltered, on a
   plain dark or light field with "Sign in with Microsoft" beside it. */
.ms{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:13px 16px;border:1px solid var(--ink-900);border-radius:var(--r);
  background:var(--ink-900);color:#fff;font-family:var(--fb);font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;transition:background .15s,box-shadow .15s}
.ms:hover{background:var(--ink-800)}
.ms:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(10,122,54,.42)}
@media (prefers-color-scheme:dark){
  .ms{background:#fff;border-color:#fff;color:var(--ink-950)}
  .ms:hover{background:#e6e9e8}
}
.ms svg{flex:none}
.note{margin:20px 0 0;font-size:12px;color:var(--tx-dim);line-height:1.6}
.note a{color:var(--green-600);text-decoration:none}
.note a:hover{text-decoration:underline}
.err{display:none;margin:0 0 18px;padding:10px 12px;border:1px solid var(--danger);
  border-radius:var(--r);background:rgba(180,35,24,.07);color:var(--danger);
  font-size:12.5px;text-align:left}
.err.on{display:block}
.foot{margin:18px 0 0;font-family:var(--fm);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-400);text-align:center}
@media (max-width:420px){.card{padding:30px 22px 24px}}
@media (prefers-reduced-motion:reduce){.ms{transition:none}}
</style>

<script>
(function(){
  /* Where to land after Entra returns. The app is hash-routed, so a deep link
     is a fragment — the server never sees it, but a browser carries the
     fragment across a 302 to a target that has none, which is how the 401
     redirect lands one here. Only our own hash shapes are accepted, so the
     value handed to post_login_redirect_uri can never point off-site. */
  function target(){
    var h=location.hash||'';
    return /^#[\w/#?=&.,-]*$/.test(h)?'/'+h:'/';
  }
  var a=document.getElementById('signin');
  a.href='/.auth/login/aad?post_login_redirect_uri='+encodeURIComponent(target());

  /* Entra hands failures back as a query string. Say what happened rather than
     leaving the same button with no explanation of why it did nothing. */
  var q=new URLSearchParams(location.search);
  var e=q.get('error')||q.get('error_description')||q.get('message');
  if(e){
    var box=document.getElementById('err');
    box.textContent='Sign-in did not complete: '+e+'. Try again, or ask for access if this keeps happening.';
    box.className='err on';                 // textContent, so a provider message is never markup
  }

  /* Somebody already signed in has no business sitting on this page — a stale
     tab, a bookmark, or the back button after signing in. Send them to the app.
     A failure here means no session, which is exactly what this page is for. */
  fetch('/.auth/me',{headers:{'Cache-Control':'no-cache'}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){ if(j&&j.clientPrincipal)location.replace(target()); })
    .catch(function(){});
})();
</script>
