
# Deploys the permanent `staging` branch to the SWA *named* preview environment
# "staging", which has a stable hostname:
#
#     https://wonderful-rock-071c8e810-staging.<region>.azurestaticapps.net
#
# Because the hostname never changes, its Entra redirect URI
# (.../.auth/login/aad/callback) is registered once and keeps working. Production is
# untouched: that deploy still comes only from the main-branch workflow, and the two
# never fire on the same push, so they cannot race.
#
# Note: staging shares this app's application settings and therefore the SAME Azure SQL
# database as production. Use TST-#### project IDs for test budgets and clear them with
# sql/cleanup_test_budgets.sql.

name: Azure Static Web Apps CI/CD (staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# Auth note: this workflow authenticates with a deployment token, and must NOT pass
# github_id_token. The OIDC path identifies the Static Web App by the workflow's
# *filename*, which has to match Azure's generated
# 'azure-static-web-apps-<adjective>-<noun>-<hex>.yml' pattern. Only the production
# workflow can own that name, so OIDC here fails with
# "Could not determine the Static Web App from the GitHub OIDC workflow reference".
#
# SETUP — needs a deployment token in a repository secret, under EITHER name:
#     AZURE_SWA_DEPLOYMENT_TOKEN                            (preferred)
#     AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_071C8E810   (also accepted)
# Get it from Azure Portal -> Static Web App -> Overview -> Manage deployment token.
# The preflight step below reports which secret it found and how long the value is, so
# a missing, misnamed or truncated token is obvious in the log instead of surfacing as
# "No matching Static Web App was found or the api key was invalid".
# Production is unaffected: it deploys from the main-branch workflow over GitHub OIDC
# and does not use either secret.

jobs:
  build_and_deploy_staging:
    runs-on: ubuntu-latest
    name: Build and Deploy to staging environment
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Prints only the name and character count — never the value, which GitHub masks
      # anyway. A healthy SWA deployment token is ~119 characters.
      - name: Preflight — deployment token
        env:
          TOKEN_NEW: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          TOKEN_OLD: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_071C8E810 }}
        run: |
          if   [ -n "$TOKEN_NEW" ]; then echo "Found AZURE_SWA_DEPLOYMENT_TOKEN (${#TOKEN_NEW} chars)"
          elif [ -n "$TOKEN_OLD" ]; then echo "Found AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_071C8E810 (${#TOKEN_OLD} chars)"
          else
            echo "::error::No deployment token found. Add a repository secret named AZURE_SWA_DEPLOYMENT_TOKEN (Settings -> Secrets and variables -> Actions) with the value from Azure Portal -> Static Web App -> Overview -> Manage deployment token."
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_071C8E810 }}
          action: "upload"
          app_location: "./app"
          api_location: "api"
          output_location: "."
          deployment_environment: staging
